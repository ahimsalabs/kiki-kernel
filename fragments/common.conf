# kiki's additions to Kata's guest kernel config, on every architecture.
# build.sh adds this file to Kata's fragments for the architecture, and
# build.sh fails if Kconfig drops or changes any option here.

# KVM, for VMs inside a VM (kiki#76). Inert unless Cloud Hypervisor
# exposes virtualization to the guest (nested=on): without SVM or VMX the
# vendor module does not initialize and no /dev/kvm appears. An inner
# Cloud Hypervisor needs nothing more: its vsock is its own (hybrid, over
# a unix socket, not vhost-vsock), and Kata's config has TUN.
CONFIG_VIRTUALIZATION=y
CONFIG_KVM=y

# btrfs, for an inner kiki's data dir on an extra disk.
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y

# /proc/config.gz, so the guest, and a check on the host, can read the
# config the running kernel was built with.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y

# BTF type information for eBPF (kiki#64). It needs DWARF at build time;
# the published amd64 vmlinux has the DWARF stripped and keeps .BTF (the
# arm64 Image never carries DWARF).
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
CONFIG_DEBUG_INFO_BTF=y
